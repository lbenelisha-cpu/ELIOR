name: Wave window backtest

on:
  push:
    paths:
      - '.github/workflows/wave-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run backtest
        run: python scripts/backtest_compare.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest-results.json
          git commit -m "Update wave backtest results" || exit 0
          git push
\n# rerun-data-vision-2\n