[build]
  publish = "."
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/push-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/push.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
[[redirects]]
  from = "/mt4/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
