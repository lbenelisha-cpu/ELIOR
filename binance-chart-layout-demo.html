<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת תצוגת תנועות הגרף</title><link rel="stylesheet" href="/binance-agent.css?v=20261026-move-lanes"><link rel="stylesheet" href="/ma-slope-panel.css?v=20261026-slope2"><style>body{padding:25px;background:#0a1620;color:#dbeaf3;font-family:Arial}main{max-width:1200px;margin:auto}h1{font-size:22px}p{font-size:13px;color:#a9becd}.chart-wrap{height:380px}button{font-family:Arial}</style><main><h1>עליות מעל הגרף · ירידות מתחתיו</h1><p>תצוגת בדיקה בלבד — נתונים מלאכותיים. שתי שורות לכל כיוון; ״עוד״ מציג את כל המהלכים באזור הצפוף.</p><label><input id="showRises" type="checkbox" checked> הצג תנועות של 1% ומעלה</label><div id="chartRises" class="chart-move-lane"></div><div class="chart-wrap"><canvas id="priceChart"></canvas></div><div id="chartFalls" class="chart-move-lane down"></div><p id="chartRiseDetails" role="status"></p><details id="chartMoveBreakdown" class="chart-rise-breakdown"><summary id="chartRiseSummary"></summary><div id="chartRiseList"></div></details><section id="binanceSlope" aria-label="ניתוח שיפוע הממוצעים"></section></main><script src="/binance-indicators.js?v=20261026-move-lanes"></script><script type="module">
// Read the exact production renderer, while keeping the fixture entirely free of
// account data, credentials, authenticated requests and trading controls.
const source=await (await fetch('/binance-agent.js?v=20261026-move-lanes')).text();
const renderer=source.slice(source.indexOf('let selectedChartMove=null;'),source.indexOf('\nlet candleFlashOn='));
const setup=`const $=s=>document.querySelector(s),put=(s,t)=>{const n=$(s);if(n)n.textContent=t;},fmt=(n,d)=>Number(n).toFixed(d),tradeExecutionTime=t=>new Date(t).toLocaleString('he-IL');
const selectedSymbol='DEMO',selectedInterval='5m',chartCandles=[];
const count=1000,start=Date.now()-count*300000;let previous=100;
for(let i=0;i<count;i++){const close=100+10*Math.sin(i/50)+4*Math.sin(i*.72),open=previous;chartCandles.push({openTime:start+i*300000,closeTime:start+(i+1)*300000-1,open,close,high:Math.max(open,close)+.5,low:Math.min(open,close)-.5,closed:true});previous=close;}
function drawCandles(view){const canvas=$('#priceChart'),W=canvas.clientWidth,H=canvas.clientHeight,r=devicePixelRatio||1;canvas.width=W*r;canvas.height=H*r;const ctx=canvas.getContext('2d');ctx.scale(r,r);const left=18,right=W-74,top=22,bottom=H-35,step=(right-left)/view.length,y=p=>top+(116-p)/32*(bottom-top);ctx.fillStyle='#0b1721';ctx.fillRect(0,0,W,H);ctx.font='11px Arial';for(let p=85;p<=115;p+=5){ctx.strokeStyle='#243746';ctx.beginPath();ctx.moveTo(left,y(p));ctx.lineTo(right,y(p));ctx.stroke();ctx.fillStyle='#8da6bc';ctx.fillText(p,right+8,y(p)+4);}for(let i=0;i<view.length;i++){const b=view[i],x=left+step*(i+.5);ctx.strokeStyle=b.close>=b.open?'#4cd6a3':'#f3788f';ctx.beginPath();ctx.moveTo(x,y(b.high));ctx.lineTo(x,y(b.low));ctx.stroke();}renderChartRises(ctx,view,{left,right,top,bottom,step,y,digits:3});}
`;
new Function(setup+renderer+"drawCandles(chartCandles);window.LEVI_MA_SLOPE_DATA={symbol:'DEMO · נתונים מלאכותיים',bars:chartCandles};globalThis.LEVI_MA_SLOPE?.renderBinance(window.LEVI_MA_SLOPE_DATA);window.addEventListener('resize',()=>drawCandles(chartCandles));$('#showRises').addEventListener('change',()=>drawCandles(chartCandles));")();
</script><script type="module" src="/ma-slope-panel.js?v=20261026-slope2"></script></html>
