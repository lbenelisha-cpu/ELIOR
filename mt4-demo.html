<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LEVI · צפייה ב־MT4</title><style>body{background:#071625;color:#eef7ff;font:17px Arial;max-width:1000px;margin:30px auto;padding:20px}input,button{padding:12px;margin:6px}section{background:#112c43;padding:20px;border-radius:14px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:right;border-bottom:1px solid #365269}.ok{color:#52e4a4}.warn{color:#ffcd69}</style>
<p><a href="/atrade-market.html" style="color:#63cfff">ניתוח נכסי אטרייד</a></p><h1>חשבון MT4 — צפייה בלבד</h1><p>נתוני הברוקר מוצגים בנפרד מתיק הסימולציה. חיבור זה קורא נתונים בלבד.</p><label>מפתח צפייה <input id="key" type="password" autocomplete="off"></label><button id="connect">התחבר לצפייה</button><button id="disconnect">נתק תצוגה</button><p id="status" role="status">טרם התחבר</p><section id="summary"></section><section style="overflow:auto"><table><thead><tr><th>נכס</th><th>סוג</th><th>לוטים</th><th>מחיר כניסה</th><th>רווח צף</th><th>Swap</th><th>עמלה</th></tr></thead><tbody id="positions"></tbody></table></section>
<script>
let token='',busy=false,generation=0;const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){if(!token||busy)return;busy=true;const g=generation;try{const r=await fetch('/.netlify/functions/mt4-demo',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(12000)});const d=await r.json();if(g!==generation)return;if(!r.ok)throw Error(d.error||'שגיאת חיבור');el('status').className=d.connected?'ok':'warn';el('status').textContent=d.connected?'מתקבלים נתונים מ־MT4':'אין עדכון טרי — הנתונים המוצגים עשויים להיות ישנים';if(!d.payload){el('summary').textContent='ממתין לשידור הראשון מ־MT4';return;}const p=d.payload;const money=n=>Number(n).toLocaleString('he-IL',{maximumFractionDigits:2})+' '+p.currency;el('summary').innerHTML='<h2>חשבון '+esc(p.account)+' · '+esc(p.server)+'</h2><p class="warn">'+(p.mode==='real'?'הברוקר מציג דמו; MT4 מדווח REAL (2). החשבון אינו מסווג כאן כדמו מאומת.':'MT4 מדווח DEMO')+'</p><p>קריאת נתונים בלבד</p><p>יתרה: '+esc(money(p.balance))+' · שווי: '+esc(money(p.equity))+'</p><p>רווח/הפסד צף לפי MT4: '+esc(money(p.profit))+'</p><p>בטוחות בשימוש: '+esc(money(p.margin))+' · בטוחות פנויות: '+esc(money(p.freeMargin))+'</p><small>התקבל בשרת: '+esc(new Date(d.received_at).toLocaleString('he-IL'))+'</small>';el('positions').innerHTML=p.positions.length?p.positions.map(x=>'<tr>'+[x.symbol,x.side,x.lots,x.openPrice,x.profit,x.swap,x.commission].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="7">אין פוזיציות או הוראות פתוחות</td></tr>';}catch(e){if(g===generation){el('status').textContent='שגיאת חיבור: '+e.message+' — נתונים קודמים אינם עדכניים';el('status').className='warn';}}finally{busy=false;}}
el('connect').onclick=()=>{generation++;token=el('key').value;el('key').value='';refresh();};el('disconnect').onclick=()=>{generation++;token='';el('summary').textContent='';el('positions').textContent='';el('status').textContent='התצוגה נותקה';};setInterval(refresh,30000);
</script></html>
